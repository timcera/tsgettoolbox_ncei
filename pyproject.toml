[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=80"
]

[project]
authors = [
    { email = "tim@cerazone.net", name = "Tim Cera" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules"
] # Get strings from http://pypi.python.org/pypi?%3Aaction=list_classifiers
dependencies = [
    "numpy",
    "pandas",
    "platformdirs",
    "requests",
    "tsgettoolbox >=27.0.0"
]

description = "Plugin for tsgettoolbox to access NOAA National Centers for Environmental Information (NCEI) data."
dynamic = ["readme", "version"]
keywords = [
    "rest",
    "time-series",
    "uri",
    "url",
    "web_services"
]
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
name = "tsgettoolbox_ncei"
requires-python = ">=3.10"

[project.urls]
bitbucket = "https://bitbucket.org/timcera/tsgettoolbox_ncei/src/main/"
documentation = "https://timcera.bitbucket.io/tsgettoolbox/docs/index.html#tsgettoolbox-documentation"
github = "https://github.com/timcera/tsgettoolbox_ncei"

[tool.commitizen]
multiline = true
name = "cz_conventional_commits"
tag_format = "v$version"
update_changelog_on_bump = true
version = "27.0.0"
version_files = ["VERSION"]

[tool.isort]
profile = "black"

[tool.jupytext]
formats = "auto:percent"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
fix = true

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort.import-heading]
first-party = "First party imports"
future = "Future imports"
local-folder = "Local folder imports"
standard-library = "Standard library imports"
third-party = "Third party imports"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
readme = { file = "README.rst" }
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests"]
